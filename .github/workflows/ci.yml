name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-targets:
    name: Lint, Standards & Cross-Target Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets & features)
        run: cargo clippy --workspace --exclude tej-db-benches --all-targets --all-features -- -D warnings
      - name: Check benchmarks compile
        run: cargo check -p tej-db-benches
      - name: Pager no-default-features
        run: cargo check -p tej-db-pager --no-default-features
      - name: WASM32 check
        run: cargo check -p tej-db --target wasm32-unknown-unknown --no-default-features
      - name: Check AGENTS.md modularity & safety rules
        run: ./scripts/check_agents_rules.sh

  test-matrix:
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        run: cargo test --workspace --exclude tej-db-benches -j 2

  msrv:
    name: MSRV Check (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace with MSRV
        run: cargo check --workspace --exclude tej-db-benches
