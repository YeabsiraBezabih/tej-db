name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude tej-db-benches --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --exclude tej-db-benches
      - name: Pager no-default-features
        run: cargo check -p tej-db-pager --no-default-features
      - name: WASM32 check
        run: cargo check -p tej-db --target wasm32-unknown-unknown --no-default-features
