name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-artifacts:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            lib: libtej_db_ffi.so
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            lib: libtej_db_ffi.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            lib: tej_db_ffi.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI & FFI
        run: cargo build --release -p tej-db-cli -p tej-db-ffi
      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/tej-db-cli dist/
          cp target/release/${{ matrix.lib }} dist/
          tar -czvf tej-db-${{ matrix.target }}.tar.gz -C dist .
      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/tej-db-cli.exe dist/
          Copy-Item target/release/${{ matrix.lib }} dist/
          Compress-Archive -Path dist/* -DestinationPath tej-db-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tej-db-${{ matrix.target }}
          path: |
            tej-db-*.tar.gz
            tej-db-*.zip

  github-release:
    name: Create GitHub Release
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  publish-crates:
    name: Publish to crates.io (Optional)
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v') && env.HAS_CARGO_TOKEN == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates
        run: ./scripts/publish_crates.sh
